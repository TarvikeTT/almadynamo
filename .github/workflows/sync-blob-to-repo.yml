name: Sync CSV from Azure Blob

on:
  schedule:
    # Azure Function ajaa klo 03:00 UTC ja on valmis parissa minuutissa,
    # joten haetaan vasta 03:30 UTC (06:30 kesäaikaa / 05:30 talviaikaa).
    - cron: '30 3 * * *'
  workflow_dispatch:

# Estää kahden ajon päällekkäisyyden, joka johtaa push-konfliktiin.
# Uusi ajo odottaa edellisen valmistumista sen sijaan että keskeyttäisi sen.
concurrency:
  group: sync-blob-to-repo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # Yksi lista, jota molemmat stepit käyttävät. Uusi feedi lisätään vain tähän.
      FILES: >-
        tarvike_tarjoukset.csv
        tarvike_tarjoukset_ai.csv
        tarvike_laitetarjoukset.csv
        tarvike_monkijat_feed.csv
        tarvike_pienkoneet_ja_tyokalut_feed.csv
        tarvike_metsa_piha_ja_puutarha_feed.csv

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download CSV files from Azure Blob
        run: |
          SAS_URL="${{ secrets.AZURE_BLOB_SAS_URL }}"
          BASE=$(echo "$SAS_URL" | cut -d'?' -f1)
          TOKEN=$(echo "$SAS_URL" | cut -d'?' -f2)

          for f in $FILES; do
            echo "Haetaan $f"
            curl -f -sS -o "$f" "${BASE}algolia/${f}?${TOKEN}"
          done

      - name: Commit and push if changed
        run: |
          BRANCH="${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            # Siirretään pohja etähaaran uusimpaan tilaan. Indeksi tulee
            # etähaarasta, työhakemistoon ladatut CSV:t jäävät paikoilleen,
            # joten muiden tekemät muutokset muihin tiedostoihin säilyvät.
            git fetch origin "$BRANCH"
            git reset --mixed FETCH_HEAD

            git add $FILES
            if git diff --staged --quiet; then
              echo "CSV-tiedostot ovat jo ajan tasalla, ei committia."
              exit 0
            fi

            git commit -m "Auto-update CSV files"

            if git push origin "HEAD:$BRANCH"; then
              echo "Push onnistui yrityksellä $attempt."
              exit 0
            fi

            echo "Push hylättiin (yritys $attempt/3) - haara ehti muuttua. Yritetään uudelleen."
            sleep 5
          done

          echo "Push epäonnistui kolmen yrityksen jälkeen."
          exit 1

          git add $FILES
          git diff --staged --quiet || git commit -m "Auto-update CSV files"
          git push
